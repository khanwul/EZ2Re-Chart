schema_version = 1
chunk_frames = 120
timestamp_policy = "strict"
brightness_threshold = 40.0
edge_threshold = 12.0
search_radius_px = 8
alignment_probe_ms = 2000.0
barline_min_brightness = 30.0
barline_max_brightness = 180.0
barline_max_thickness = 8

# Common algorithm parameters, independent of song metadata and BPM.
[motion]
min_similarity = 0.70
match_tolerance_px = 2.0
max_speed_px_per_ms = 6.0
# A search bound, not an assumed per-frame displacement.
displacement_slack_px = 4.0
min_lanes = 2
history_frames = 8
ambiguity_ratio = 0.90
repeat_difference = 0.75

[fusion]
grid_px = 1.0
tile_bins = 2048
unknown_weight = 0.5
occluded_weight = 0.1
clipped_weight = 0.25
effect_weight = 0.0
repeat_group_cap = 1.0
inferred_motion_weight = 0.25

# Pixel interval inference only. Costs are heuristics, not probabilities.
[decode]
endpoint_radius_px = 2.0
support_weight = 1.0
note_cost = 0.8
endpoint_reward = 2.0
additional_endpoint_cost = 1.0
body_reward = 1.0
body_only_reward = 3.0
body_bright = 0.20
body_dark = 0.08
absence_cost_per_px = 0.12
unavailable_cost_per_px = 0.002
missing_endpoint_cost = 0.8
ambiguity_cost = 0.35

[project]
name = "ez2cv"
version = "0.1.0"
description = "Extract rhythm-game chart data from EZ2ON gameplay videos"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
]

[project.scripts]
ez2cv = "ez2cv.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

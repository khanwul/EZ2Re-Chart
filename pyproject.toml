[project]
name = "ez2rc"
version = "0.1.0"
description = "EZ2Re:Chart — extract chart data from EZ2ON REBOOT : R gameplay videos"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
]

[project.scripts]
ez2rc = "ez2rc.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
